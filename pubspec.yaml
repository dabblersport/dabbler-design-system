name: dabbler_design_system
description: "Dabbler design system — a runnable Flutter package whose entry point is the component gallery."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.1
  flutter: ">=3.10.0"

dependencies:
  # KAN-263 — this package ships widgets (`package:flutter` imports across
  # lib/), so it must declare the SDK it ships against directly. Before this,
  # Flutter reached lib/ only transitively via `flutter_test` in
  # dev_dependencies, which a consumer such as `dabbler-code` must never be
  # asked to rely on.
  flutter:
    sdk: flutter
  # KAN-235 / DECISIONS.md T-083 — cto-approved at component time.
  iconsax_flutter: ^1.0.0
  # KAN-226 / DECISIONS.md T-084 — cto-approved at component time. The Dart
  # Multiavatar port. This constraint MUST stay identical to dabbler-code's
  # (`pubspec.yaml:140`): that identity is what keeps one seed producing one
  # face across the product, so a one-sided bump is a defect, not an upgrade.
  random_avatar: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # KAN-254 / DS-103b — the four faces DabblerType names, vendored as local
  # binaries. No `google_fonts` runtime dependency (AC1): a design system that
  # needs the network to render its own type is not a design system.
  #
  # Two roles x two scripts, exactly as `tokens/typography.css` declares them:
  #
  #   | role    | Latin  | Arabic     |
  #   |---------|--------|------------|
  #   | display | Gloock | Wingx      |
  #   | sans    | Glory  | Meral Sans |
  #
  # The `family:` names below are the BARE names in DabblerType; because they
  # ship inside this package, a consumer addresses them as
  # `packages/dabbler_design_system/<family>`, which is what
  # DabblerType.fontFamilyFor builds. Flutter registers both spellings from
  # this one declaration.
  #
  # Weights: only the five the ramp names (--weight-light..bold, 300-700) are
  # vendored. Glory's 100/200/800 and Meral Sans's thin/extralight/extrabold/
  # black exist in the design bundle but no ramp step reaches them, so
  # bundling them would be dead payload.
  #
  # Gloock and Glory are SIL OFL 1.1 (fonts/OFL-Gloock.txt, fonts/OFL-Glory.txt)
  # and are the real Figma-kit faces, fetched from Google Fonts as static
  # instances. Wingx and Meral Sans are copied from the design bundle's own
  # `assets/fonts/` and carry no licence metadata — flagged in the DS-103b
  # report, not resolved here.
  fonts:
    - family: Gloock
      fonts:
        - asset: fonts/Gloock-Regular.ttf
          weight: 400
    - family: Glory
      fonts:
        - asset: fonts/Glory-Light.ttf
          weight: 300
        - asset: fonts/Glory-Regular.ttf
          weight: 400
        - asset: fonts/Glory-Medium.ttf
          weight: 500
        - asset: fonts/Glory-SemiBold.ttf
          weight: 600
        - asset: fonts/Glory-Bold.ttf
          weight: 700
    - family: Wingx
      fonts:
        - asset: fonts/Wingx-Regular.otf
          weight: 400
    - family: Meral Sans
      fonts:
        - asset: fonts/meral-sans-light.ttf
          weight: 300
        - asset: fonts/meral-sans-regular.ttf
          weight: 400
        - asset: fonts/meral-sans-medium.ttf
          weight: 500
        - asset: fonts/meral-sans-semibold.ttf
          weight: 600
        - asset: fonts/meral-sans-bold.ttf
          weight: 700
